name: publish

# Publishes to npm when a version tag is pushed (git tag v0.2.0 && git push --tags).
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --provenance --access public
